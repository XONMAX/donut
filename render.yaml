# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → pick this repo. Render builds the Dockerfile,
# attaches a persistent disk for the SQLite database, and generates ADMIN_TOKEN.
services:
  - type: web
    name: dropduel
    runtime: docker
    plan: starter # persistent disks need a paid instance
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: BRIDGE
        value: mock # switch to "mineflayer" once the bot account is set up
      - key: BOT_USERNAME
        value: DropDuelBank
      - key: DONUTSMP_API_KEY
        sync: false # entered in the dashboard; create it in-game with /api
      - key: SITE_URL
        sync: false # optional: your custom domain, e.g. https://dropduel.gg
      - key: MC_EMAIL
        sync: false
